<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Hull Starboard / Left Gradient (Navy) -->
    <linearGradient id="hullStarboard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Hull Port / Right Gradient (Maritime Blue) -->
    <linearGradient id="hullPort" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="60%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <!-- Upper Forecastle Deck -->
    <linearGradient id="deckLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Waterline Streamlines -->
    <linearGradient id="waterLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="1" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Pure Crisp White Background with Software-Grade Subtle Border -->
  <rect x="8" y="8" width="496" height="496" rx="96" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4"/>

  <!-- Subtle Blueprint Calibration Grid (Light Grey / Precision Engineering) -->
  <g stroke="#E2E8F0" stroke-width="1.5" opacity="0.8">
    <line x1="64" y1="128" x2="448" y2="128" />
    <line x1="64" y1="192" x2="448" y2="192" />
    <line x1="64" y1="256" x2="448" y2="256" />
    <line x1="64" y1="320" x2="448" y2="320" />
    <line x1="64" y1="384" x2="448" y2="384" />
    <line x1="128" y1="64" x2="128" y2="448" />
    <line x1="192" y1="64" x2="192" y2="448" />
    <line x1="256" y1="64" x2="256" y2="448" />
    <line x1="320" y1="64" x2="320" y2="448" />
    <line x1="384" y1="64" x2="384" y2="448" />
    <circle cx="256" cy="256" r="140" fill="none" stroke-width="1.5" stroke-dasharray="6 6" />
  </g>

  <!-- Clean Streamline Waterline at Bottom -->
  <path d="M 64 360 C 130 376, 190 344, 256 360 C 322 376, 382 344, 448 360" fill="none" stroke="url(#waterLine)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Geometric Ship Hull (Architectural Vector Scantling Form) -->
  <!-- Upper Forecastle Deck -->
  <polygon points="256,92 384,188 256,220 128,188" fill="url(#deckLight)" stroke="#94A3B8" stroke-width="2" />

  <!-- Port Outer Shell (Right Facet) -->
  <polygon points="256,220 384,188 340,364 256,416" fill="url(#hullPort)" stroke="#1D4ED8" stroke-width="1.5" />

  <!-- Starboard Outer Shell (Left Facet) -->
  <polygon points="256,220 128,188 172,364 256,416" fill="url(#hullStarboard)" stroke="#1E3A8A" stroke-width="1.5" />

  <!-- Internal Structural Frame Stations & Web Girders -->
  <g stroke="#93C5FD" stroke-width="2.5" fill="none" opacity="0.9">
    <!-- Frame Station 1 -->
    <polyline points="152,228 256,260 360,228" />
    <line x1="256" y1="260" x2="256" y2="330" />
    <!-- Web Frame Station 2 -->
    <polyline points="180,285 256,315 332,285" stroke="#60A5FA" stroke-width="3" />
    <line x1="256" y1="315" x2="256" y2="385" stroke="#60A5FA" stroke-width="3" />
    <!-- Bottom Floor Girder -->
    <line x1="200" y1="360" x2="256" y2="380" stroke="#0284C7" stroke-width="3.5" />
    <line x1="312" y1="360" x2="256" y2="380" stroke="#0284C7" stroke-width="3.5" />
  </g>

  <!-- Precision Centerline Keel / Stem Line -->
  <line x1="256" y1="92" x2="256" y2="422" stroke="#0284C7" stroke-width="5" stroke-linecap="round"/>

  <!-- Bulbous Apex Node -->
  <circle cx="256" cy="420" r="12" fill="#FFFFFF" stroke="#0284C7" stroke-width="4" />
  <circle cx="256" cy="420" r="5" fill="#1E3A8A" />

  <!-- Subtle Precision Pointers -->
  <g fill="#94A3B8">
    <polygon points="256,48 261,64 251,64" />
    <polygon points="464,256 448,251 448,261" />
    <polygon points="48,256 64,251 64,261" />
  </g>
</svg>
