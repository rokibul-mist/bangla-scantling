<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="760" height="180">
  <defs>
    <!-- Mark Gradients -->
    <linearGradient id="markHullPortW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="markHullStbdW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Pure White Background -->
  <rect width="760" height="180" fill="#FFFFFF"/>

  <!-- Left Logo Icon Mark on White (140x140) -->
  <g transform="translate(18, 20)">
    <rect width="140" height="140" rx="30" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
    
    <!-- Blueprint Grid -->
    <line x1="20" y1="70" x2="120" y2="70" stroke="#E2E8F0" stroke-width="1" />
    <line x1="70" y1="20" x2="70" y2="120" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="70" cy="70" r="38" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3" />

    <!-- Ship Hull Icon in Mark -->
    <polygon points="70,26 104,52 70,61 36,52" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" />
    <polygon points="70,61 104,52 92,100 70,114" fill="url(#markHullPortW)" />
    <polygon points="70,61 36,52 48,100 70,114" fill="url(#markHullStbdW)" />
    
    <!-- Stiffener Frames -->
    <polyline points="43,62 70,71 97,62" fill="none" stroke="#93C5FD" stroke-width="1.8" />
    <polyline points="50,81 70,89 90,81" fill="none" stroke="#60A5FA" stroke-width="1.8" />
    
    <!-- Keel -->
    <line x1="70" y1="26" x2="70" y2="116" stroke="#0284C7" stroke-width="3" stroke-linecap="round"/>
    <circle cx="70" cy="115" r="4.5" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
  </g>

  <!-- Typography: ShipLab -->
  <g transform="translate(180, 90)">
    <!-- "Ship" in Dark Slate / Navy -->
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="60" font-weight="900" fill="#0F172A" letter-spacing="-1.5">Ship<tspan fill="#2563EB">Lab</tspan></text>
  </g>

  <!-- "-BD" Clean Professional Software Badge -->
  <g transform="translate(434, 46)">
    <rect width="100" height="48" rx="10" fill="#1E40AF" />
    <text x="50" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">BD</text>
  </g>

  <!-- Subtitle Tagline (Standard Professional Technical Typography) -->
  <g transform="translate(182, 130)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#475569" letter-spacing="1">
      NAVAL ARCHITECTURE &amp; STATUTORY SCANTLINGS
    </text>
    <text x="390" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#2563EB">
      • DOS SRO 308/2001
    </text>
  </g>
</svg>
