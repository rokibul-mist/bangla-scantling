<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="760" height="180">
  <defs>
    <linearGradient id="fullBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <linearGradient id="labGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <linearGradient id="markHull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <filter id="glowF" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Logo Icon Squircle (140x140) -->
  <g transform="translate(18, 20)">
    <rect width="140" height="140" rx="34" fill="#090E1A" stroke="#0284C7" stroke-width="2.5" stroke-opacity="0.7"/>
    
    <!-- Background Grid -->
    <line x1="20" y1="70" x2="120" y2="70" stroke="#38BDF8" stroke-width="1" opacity="0.15" />
    <line x1="70" y1="20" x2="70" y2="120" stroke="#38BDF8" stroke-width="1" opacity="0.15" />
    <circle cx="70" cy="70" r="38" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3 3" opacity="0.2" />

    <!-- Ship Hull Icon in Mark -->
    <polygon points="70,26 104,52 70,61 36,52" fill="#E2E8F0" opacity="0.9" />
    <polygon points="70,61 104,52 92,100 70,114" fill="url(#markHull)" />
    <polygon points="70,61 36,52 48,100 70,114" fill="#1E40AF" />
    
    <!-- Stiffener Frames -->
    <polyline points="43,62 70,71 97,62" fill="none" stroke="#67E8F9" stroke-width="1.8" opacity="0.8"/>
    <polyline points="50,81 70,89 90,81" fill="none" stroke="#38BDF8" stroke-width="1.8" opacity="0.8"/>
    
    <!-- Glowing Keel -->
    <line x1="70" y1="26" x2="70" y2="116" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" filter="url(#glowF)"/>
    <circle cx="70" cy="115" r="4.5" fill="#10B981" />
  </g>

  <!-- Typography: ShipLab -->
  <g transform="translate(182, 92)">
    <!-- "Ship" in Bold Bright White -->
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">Ship<tspan fill="url(#labGrad)">Lab</tspan></text>
  </g>

  <!-- "-BD" Badge -->
  <g transform="translate(436, 46)">
    <rect width="112" height="52" rx="14" fill="url(#badgeGrad)" filter="url(#glowF)"/>
    <text x="56" y="37" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">BD</text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(184, 134)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#94A3B8" letter-spacing="1.2">
      NAVAL ARCHITECTURE &amp; STATUTORY SUITE
    </text>
    <text x="396" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0284C7">
      • DOS SRO 308/2001
    </text>
  </g>
</svg>
