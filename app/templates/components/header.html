<!-- Top Sticky Header -->
<header class="bg-white border-b border-slate-200 sticky top-0 z-30 no-print">
  <div class="px-5 py-2.5 flex flex-wrap items-center justify-between gap-3">
    <!-- Vessel Identity & Native App Badge -->
    <div class="flex items-center gap-2.5">
      <img src="/static/icon.png" alt="App Icon" class="w-6 h-6 rounded shadow-2xs" />
      <span class="text-sm font-bold text-slate-800 tracking-tight" id="top-vessel-name">M.V. CROWN MARINERS - 67</span>
      <span class="px-2 py-0.5 text-[10px] font-bold bg-blue-50 text-blue-700 border border-blue-200 rounded-full tracking-wide">DESKTOP SUITE</span>
    </div>
    <div class="flex items-center gap-3">
      <div class="text-[11px] text-slate-500 font-medium hidden sm:block">Inland Shipping Ordinance 1976 &amp; SRO 308/Law-2001 (Rules 8 - 147)</div>
      <button 
        onclick="toggleAppFullscreen()" 
        class="text-slate-400 hover:text-slate-700 p-1 rounded hover:bg-slate-100 transition cursor-pointer"
        title="Toggle Fullscreen"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
      </button>
    </div>
  </div>
</header>
