<!-- ShipLab-BD Professional Engineering Software Splash Screen (Light Theme) -->
<div id="app-loading-screen" class="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-slate-200/90 backdrop-blur-xs select-none transition-all duration-500 ease-out">
  <!-- Professional Software Splash Dialog Card -->
  <div class="relative w-full max-w-lg bg-white rounded-lg border border-slate-300 shadow-2xl overflow-hidden flex flex-col">
    <!-- Header Accent Bar -->
    <div class="h-1.5 bg-blue-600 w-full"></div>

    <!-- Main Splash Body -->
    <div class="p-8 sm:p-10 flex flex-col items-center text-center">
      <!-- White-Background Logo Mark -->
      <div class="mb-5 p-2 bg-white rounded-xl border border-slate-200 shadow-xs">
        <img src="/static/icon.png" alt="ShipLab-BD Logo" class="w-20 h-20 object-contain" />
      </div>

      <!-- Application Title & Subtitle -->
      <div class="flex items-center gap-2 mb-1.5">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
          Ship<span class="text-blue-600">Lab</span>
        </h1>
        <span class="px-2 py-0.5 text-xs font-bold bg-slate-100 text-slate-700 border border-slate-300 rounded tracking-normal">
          BD
        </span>
      </div>

      <div class="text-[12px] font-semibold text-slate-600 tracking-wide uppercase mb-1">
        Naval Architecture &amp; Statutory Scantlings Suite
      </div>
      <div class="text-[11px] text-slate-500 font-medium mb-6">
        Department of Shipping (DOS) • SRO 308/Law-2001 &amp; ISO 1976
      </div>

      <!-- Standard Software Loading Progress Bar -->
      <div class="w-full space-y-2 mb-2">
        <!-- Progress Track -->
        <div class="w-full h-2 bg-slate-100 rounded border border-slate-300 overflow-hidden">
          <div id="splash-progress-bar" class="h-full bg-blue-600 rounded transition-all duration-200 ease-out" style="width: 20%;"></div>
        </div>

        <!-- Live Step Indicator -->
        <div class="flex items-center justify-between text-[11px] font-mono text-slate-600 px-0.5">
          <span id="splash-status-text" class="truncate text-left font-medium">Initializing Statutory Calculation Engine...</span>
          <span id="splash-percent-text" class="font-bold text-slate-700 ml-2">20%</span>
        </div>
      </div>
    </div>

    <!-- Standard Software Bottom Status Strip -->
    <div class="bg-slate-50 border-t border-slate-200 px-5 py-2.5 flex flex-wrap items-center justify-between gap-2 text-[10.5px] text-slate-500 font-sans">
      <div class="flex items-center gap-1.5 truncate">
        <span class="w-1.5 h-1.5 rounded-full bg-blue-600"></span>
        <span>Version 2.0.0 (64-Bit Enterprise)</span>
      </div>
      <div class="font-medium text-slate-600">
        Prepared by <span class="font-bold text-slate-800">MD Rokibul Hasan</span>, Naval Architect, MIST
      </div>
    </div>
  </div>
</div>
