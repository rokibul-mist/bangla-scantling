<!-- ShipLab-BD Modern Cinematic Loading Screen -->
<div id="app-loading-screen" class="fixed inset-0 z-[9999] flex flex-col items-center justify-between p-6 sm:p-10 text-white select-none transition-all duration-700 ease-out">
  <!-- Dynamic Cinematic Background with AI-generated Naval Lab Backdrop and Ambient Blur Overlay -->
  <div class="absolute inset-0 bg-slate-950 overflow-hidden pointer-events-none -z-10">
    <div id="splash-bg-image" class="absolute inset-0 bg-cover bg-center scale-105 transition-transform duration-1000 ease-out opacity-45" style="background-image: url('/static/splash_bg.jpg');"></div>
    <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/80 to-slate-950/90 backdrop-blur-xs"></div>
    <!-- Precision CAD grid background pattern -->
    <div class="absolute inset-0 opacity-15 bg-[radial-gradient(#38bdf8_1px,transparent_1px)] [background-size:24px_24px]"></div>
  </div>

  <!-- Top System Badge -->
  <div class="w-full flex items-center justify-between text-xs text-slate-400">
    <div class="flex items-center gap-2">
      <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
      <span class="font-mono text-[11px] tracking-wider text-emerald-400 font-semibold uppercase">DOS SRO 308/Law-2001 &amp; ISO 1976</span>
    </div>
    <div class="font-mono text-[11px] tracking-wider text-slate-400">
      v2.0.0 • 64-BIT STATUTORY ENGINE
    </div>
  </div>

  <!-- Center Branding & Progress -->
  <div class="flex flex-col items-center max-w-md w-full text-center my-auto">
    <!-- Animated Glowing Logo Mark -->
    <div class="relative mb-6">
      <div class="absolute -inset-4 bg-gradient-to-r from-blue-600 via-cyan-500 to-emerald-500 rounded-3xl blur-xl opacity-40 animate-pulse"></div>
      <img src="/static/icon.png" alt="ShipLab-BD" class="relative w-24 h-24 rounded-2xl shadow-2xl border border-cyan-400/30 object-contain p-1 bg-slate-900/80 backdrop-blur-md" />
    </div>

    <!-- Software Title -->
    <div class="flex items-center gap-2 mb-2">
      <h1 class="text-3xl sm:text-4xl font-black tracking-tight text-white">
        Ship<span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">Lab</span>
      </h1>
      <span class="px-2.5 py-0.5 text-xs font-black bg-blue-600 text-white rounded-md tracking-wider shadow-sm">BD</span>
    </div>
    
    <p class="text-xs sm:text-sm text-slate-300 font-medium tracking-wide mb-8">
      Naval Architecture &amp; Structural Scantling Suite
    </p>

    <!-- Progress Container -->
    <div class="w-full space-y-3">
      <!-- Outer Track -->
      <div class="w-full h-2 bg-slate-800/80 rounded-full overflow-hidden p-0.5 border border-slate-700/60 backdrop-blur-sm shadow-inner">
        <!-- Animated Bar -->
        <div id="splash-progress-bar" class="h-full bg-gradient-to-r from-blue-500 via-cyan-400 to-emerald-400 rounded-full transition-all duration-300 ease-out shadow-[0_0_12px_rgba(56,189,248,0.6)]" style="width: 15%;"></div>
      </div>

      <!-- Live Loading Step Text -->
      <div class="flex items-center justify-between text-[11.5px] font-mono text-slate-400 px-1">
        <span id="splash-status-text" class="text-cyan-300/90 truncate">Initializing Naval Calculation Engine...</span>
        <span id="splash-percent-text" class="text-slate-400 font-semibold ml-2">15%</span>
      </div>
    </div>
  </div>

  <!-- Bottom Authority Credit -->
  <div class="w-full flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-slate-400 border-t border-slate-800/80 pt-4">
    <div class="text-[11px] text-slate-400">
      Department of Shipping (DOS) Inland Vessel Statutory Compliance System
    </div>
    <div class="text-[11px] text-slate-300 font-medium flex items-center gap-1.5">
      <span class="w-1.5 h-1.5 rounded-full bg-blue-500"></span>
      <span>Prepared by <b class="text-white font-semibold">MD Rokibul Hasan</b>, Naval Architect, MIST</span>
    </div>
  </div>
</div>
