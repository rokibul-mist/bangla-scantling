<!-- Right Sidebar (Controls & Actions) - Standard Software Light Theme -->
<aside class="w-full md:w-44 bg-white border-t md:border-t-0 md:border-l border-slate-200 flex flex-col shrink-0 md:sticky md:top-0 md:h-screen no-print z-40 select-none">
  <!-- Top Bar -->
  <div class="px-2.5 py-2 border-b border-slate-200 flex items-center justify-between bg-slate-50 shrink-0">
    <div class="text-[10px] font-bold text-slate-700 tracking-tight uppercase">Actions &amp; State</div>
    <div id="save-status-container" class="flex items-center gap-1" title="Project Autosave Status">
      <span id="save-status-dot" class="w-1.5 h-1.5 rounded-full bg-emerald-600"></span>
      <span id="save-status-text" class="text-[8.5px] text-slate-500 font-medium">Saved</span>
    </div>
  </div>

  <!-- Scrollable Action Center -->
  <div class="p-1.5 space-y-1.5 flex-1 overflow-y-auto no-scrollbar">
    
    <!-- 1. PROJECT STATE & AUTOSAVE -->
    <div class="bg-white p-1.5 rounded border border-slate-200 space-y-1 shadow-2xs">
      <div class="flex items-center justify-between">
        <button 
          id="btn-save-project" 
          onclick="saveProjectState(true)" 
          class="flex-1 mr-1.5 py-1.5 px-2 bg-slate-800 hover:bg-slate-900 active:bg-slate-950 text-white rounded text-[10px] font-semibold transition text-center cursor-pointer truncate"
        >
          <span id="save-btn-text">Save Calculation</span>
        </button>

        <!-- Autosave Toggle -->
        <label class="flex items-center gap-1 cursor-pointer select-none shrink-0" title="Toggle automatic background saving">
          <span class="text-[8.5px] font-medium text-slate-500">Auto</span>
          <div class="relative inline-block w-5 h-3">
            <input type="checkbox" id="toggle-autosave" class="sr-only peer" checked onchange="handleAutosaveToggle(this.checked)">
            <div class="w-5 h-3 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-2 peer-checked:after:border-white after:content-[''] after:absolute after:top-[1px] after:left-[1px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-2.5 after:w-2.5 after:transition-all peer-checked:bg-blue-600"></div>
          </div>
        </label>
      </div>
    </div>

    <!-- 2. OFFICIAL PDF DELIVERABLES (CONSOLIDATED 4 BOOKLETS) -->
    <div class="bg-white p-1.5 rounded border border-slate-200 space-y-1 shadow-2xs">
      <div class="text-[9px] font-bold text-slate-600 uppercase tracking-wider pb-0.5 border-b border-slate-100 flex items-center justify-between">
        <span>PDF Deliverables</span>
        <span class="text-[8px] font-mono text-slate-400">DOS</span>
      </div>

      <!-- Detail Calc PDF -->
      <button 
        id="btn-view-detail-calc-pdf" 
        onclick="openDetailCalcPdfModal()" 
        class="w-full py-1.5 px-2 bg-slate-50 hover:bg-slate-100 active:bg-slate-200 text-slate-700 hover:text-slate-900 border border-slate-200 rounded text-[9.5px] font-medium transition flex items-center justify-between cursor-pointer"
        title="View Technical PDF Booklet: Detail Calculation Sheets with Vector Figures"
      >
        <span class="truncate">Detail Calc PDF</span>
        <span class="text-[8px] font-mono px-1 py-0.2 bg-white border border-slate-200 text-slate-500 rounded">PDF</span>
      </button>

      <!-- Lightship PDF -->
      <button 
        id="btn-view-lightship-pdf" 
        onclick="openLightshipPdfModal()" 
        class="w-full py-1.5 px-2 bg-slate-50 hover:bg-slate-100 active:bg-slate-200 text-slate-700 hover:text-slate-900 border border-slate-200 rounded text-[9.5px] font-medium transition flex items-center justify-between cursor-pointer"
        title="View Official Lightship PDF Booklet: Cover Page + Steel Plating + Stiffeners + Outfitting"
      >
        <span class="truncate">Lightship PDF</span>
        <span class="text-[8px] font-mono px-1 py-0.2 bg-white border border-slate-200 text-slate-500 rounded">PDF</span>
      </button>

      <!-- Hull Strength PDF -->
      <button 
        id="btn-view-strength-pdf" 
        onclick="openStrengthPdfModal()" 
        class="w-full py-1.5 px-2 bg-slate-50 hover:bg-slate-100 active:bg-slate-200 text-slate-700 hover:text-slate-900 border border-slate-200 rounded text-[9.5px] font-medium transition flex items-center justify-between cursor-pointer"
        title="View Official 4-Page Hull Strength & Midship Modulus PDF Booklet with Tables 66/67"
      >
        <span class="truncate">Hull Strength PDF</span>
        <span class="text-[8px] font-mono px-1 py-0.2 bg-white border border-slate-200 text-slate-500 rounded">PDF</span>
      </button>

      <!-- Application Form PDF -->
      <button 
        id="btn-view-app-form-pdf" 
        onclick="openAppFormPdfModal()" 
        class="w-full py-1.5 px-2 bg-slate-50 hover:bg-slate-100 active:bg-slate-200 text-slate-700 hover:text-slate-900 border border-slate-200 rounded text-[9.5px] font-medium transition flex items-center justify-between cursor-pointer"
        title="View Official 25-Page DOS Application Form PDF with Corner Seals"
      >
        <span class="truncate">Application Form</span>
        <span class="text-[8px] font-mono px-1 py-0.2 bg-white border border-slate-200 text-slate-500 rounded">PDF</span>
      </button>
    </div>

    <!-- 3. COMPLIANCE & ENGINEERING UTILITIES -->
    <div class="bg-white p-1.5 rounded border border-slate-200 space-y-1 shadow-2xs">
      <div class="text-[9px] font-bold text-slate-600 uppercase tracking-wider pb-0.5 border-b border-slate-100">
        Utilities
      </div>

      <!-- Verify Deliverables -->
      <button 
        id="btn-verify-deliverables" 
        onclick="typeof openVerificationModal === 'function' ? openVerificationModal() : runFullVerificationSuite()" 
        class="w-full py-1.5 px-2 bg-slate-50 hover:bg-slate-100 active:bg-slate-200 text-slate-800 border border-slate-200 hover:border-slate-300 rounded text-[10px] font-semibold transition flex items-center justify-center gap-1.5 cursor-pointer text-center"
        title="Run 100-Point Statutory &amp; Scantling Cross-Verification Audit"
      >
        <span>Verify Deliverables</span>
        <span id="badge-verify-status" class="hidden"></span>
      </button>

      <!-- Auto-Comply Button -->
      <button 
        id="btn-auto-comply" 
        onclick="window.autoComplyModal && window.autoComplyModal.open ? window.autoComplyModal.open() : (window.calcBrainEngine && window.calcBrainEngine.autoComplyAllScantlings ? window.calcBrainEngine.autoComplyAllScantlings() : (typeof autoComplyAllScantlings === 'function' ? autoComplyAllScantlings() : alert('Auto-comply function is initializing...')))" 
        class="w-full py-1.5 px-2 bg-slate-50 hover:bg-slate-100 active:bg-slate-200 text-slate-800 border border-slate-200 hover:border-slate-300 rounded text-[10px] font-semibold transition text-center cursor-pointer truncate"
        title="Auto-adjust actual scantlings to meet or exceed rule required minimums"
      >
        <span>Auto-Comply Scantlings</span>
      </button>

      <!-- .dos Project Files (2-Column Grid) -->
      <div class="grid grid-cols-2 gap-1 pt-0.5">
        <button 
          id="btn-save-dos" 
          class="py-1 px-1 bg-white hover:bg-slate-50 border border-slate-200 hover:border-slate-300 text-slate-700 rounded text-[9px] font-medium transition text-center cursor-pointer truncate" 
          title="Save complete project state in .dos format"
        >
          <span>Save (.dos)</span>
        </button>
        <button 
          id="btn-open-dos" 
          class="py-1 px-1 bg-white hover:bg-slate-50 border border-slate-200 hover:border-slate-300 text-slate-700 rounded text-[9px] font-medium transition text-center cursor-pointer truncate" 
          title="Open or import a saved .dos project file"
        >
          <span>Open (.dos)</span>
        </button>
      </div>
      <input type="file" id="input-open-dos" accept=".dos,.json" class="hidden">

      <!-- Reset Defaults -->
      <button 
        id="btn-reset-default" 
        class="w-full py-0.5 text-slate-400 hover:text-slate-600 rounded text-[8.5px] font-medium transition text-center cursor-pointer truncate" 
        title="Reset to Excel Master Defaults"
      >
        Reset Defaults
      </button>
    </div>

    <!-- 4. OFFICIAL ENGINEERING SEALS -->
    <div class="bg-white p-1.5 rounded border border-slate-200 space-y-1 shadow-2xs">
      <div class="text-[9px] font-bold text-slate-600 uppercase tracking-wider pb-0.5 border-b border-slate-100">
        Engineering Seals
      </div>

      <div class="grid grid-cols-2 gap-1.5">
        <!-- Designer Seal -->
        <div class="bg-slate-50/50 p-1 rounded border border-slate-200 flex flex-col justify-between">
          <div class="flex items-center justify-between mb-0.5">
            <span class="text-[8.5px] font-bold text-slate-700">Designer</span>
            <button id="btn-clear-designer-seal" onclick="clearSeal('designer')" class="text-[7.5px] text-rose-600 hover:text-rose-800 hidden font-bold cursor-pointer">×</button>
          </div>
          <div id="preview-designer-seal" class="h-8 bg-white border border-slate-200 rounded flex items-center justify-center p-0.5 mb-1 overflow-hidden">
            <img id="img-designer-seal" src="/static/designer_seal_default.png" alt="Designer Seal" class="max-h-7 max-w-full object-contain"/>
          </div>
          <label for="upload-designer-seal" class="block cursor-pointer">
            <input type="file" id="upload-designer-seal" accept="image/png,image/jpeg,image/webp" class="sr-only" onclick="this.value=null;" onchange="handleSealUpload('designer', event)">
            <span class="w-full py-0.5 px-1 bg-white hover:bg-slate-50 border border-slate-200 hover:border-slate-300 text-slate-700 rounded text-[8.5px] font-medium block text-center transition cursor-pointer truncate">
              Upload
            </span>
          </label>
        </div>

        <!-- Checker Seal -->
        <div class="bg-slate-50/50 p-1 rounded border border-slate-200 flex flex-col justify-between">
          <div class="flex items-center justify-between mb-0.5">
            <span class="text-[8.5px] font-bold text-slate-700">Checker</span>
            <button id="btn-clear-checker-seal" onclick="clearSeal('checker')" class="text-[7.5px] text-rose-600 hover:text-rose-800 hidden font-bold cursor-pointer">×</button>
          </div>
          <div id="preview-checker-seal" class="h-8 bg-white border border-slate-200 rounded flex items-center justify-center p-0.5 mb-1 overflow-hidden">
            <img id="img-checker-seal" src="/static/checker_seal_default.png" alt="Checker Seal" class="max-h-7 max-w-full object-contain"/>
          </div>
          <label for="upload-checker-seal" class="block cursor-pointer">
            <input type="file" id="upload-checker-seal" accept="image/png,image/jpeg,image/webp" class="sr-only" onclick="this.value=null;" onchange="handleSealUpload('checker', event)">
            <span class="w-full py-0.5 px-1 bg-white hover:bg-slate-50 border border-slate-200 hover:border-slate-300 text-slate-700 rounded text-[8.5px] font-medium block text-center transition cursor-pointer truncate">
              Upload
            </span>
          </label>
        </div>
      </div>
    </div>

    <!-- 5. VESSEL DATABASE (ARCHIVED SHIP CALCULATIONS) -->
    <div class="bg-white p-1.5 rounded border border-slate-200 space-y-1 shadow-2xs">
      <div class="text-[9px] font-bold text-slate-600 uppercase tracking-wider pb-0.5 border-b border-slate-100 flex items-center justify-between">
        <span>Vessel Archive</span>
        <span id="nav-vessel-count" class="text-[8px] px-1 py-0.2 rounded font-mono font-medium bg-slate-100 text-slate-600 border border-slate-200">DB</span>
      </div>

      <button 
        id="btn-open-vessel-db"
        onclick="if (window.navigation) window.navigation.switchTab('vessel-db');" 
        class="w-full py-1.5 px-2 bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-200 rounded text-[9.5px] font-semibold transition flex items-center justify-center gap-1.5 cursor-pointer text-center"
        title="Open Vessel Database Archive"
      >
        <svg class="w-3 h-3 shrink-0 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
        <span>Open Database</span>
      </button>

      <div class="grid grid-cols-2 gap-1 pt-0.5">
        <button 
          onclick="openSaveVesselModal()" 
          class="py-1 px-1 bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 rounded text-[8.5px] font-medium transition text-center cursor-pointer truncate flex items-center justify-center gap-0.5" 
          title="Save this vessel into permanent Database"
        >
          <span>Save DB</span>
        </button>
        <button 
          onclick="if (window.navigation) window.navigation.switchTab('vessel-db');" 
          class="py-1 px-1 bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 rounded text-[8.5px] font-medium transition text-center cursor-pointer truncate flex items-center justify-center gap-0.5" 
          title="Browse stored vessels from database"
        >
          <span>Browse</span>
        </button>
      </div>
    </div>

  </div>

  <!-- Bottom Engine Indicator -->
  <div class="px-2.5 py-1.5 border-t border-slate-200 bg-slate-50 text-[8.5px] text-slate-500 flex items-center justify-between shrink-0 hidden md:flex">
    <span class="font-medium truncate">PDF Vector Engine</span>
    <span class="font-mono text-emerald-600 font-semibold">Active</span>
  </div>
</aside>
