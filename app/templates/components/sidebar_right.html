<!-- Right Sidebar (Controls & Actions) - Ultra-Compact & Clean -->
<aside class="w-full md:w-44 bg-white border-t md:border-t-0 md:border-l border-slate-200 flex flex-col shrink-0 md:sticky md:top-0 md:h-screen no-print z-40 select-none">
  <!-- Top Bar -->
  <div class="px-2.5 py-1.5 border-b border-slate-200 flex items-center justify-between bg-white shrink-0">
    <div class="text-[10px] font-bold text-slate-800 tracking-tight uppercase">Controls &amp; State</div>
    <div id="save-status-container" class="flex items-center gap-1" title="Project Autosave Status">
      <span id="save-status-dot" class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
      <span id="save-status-text" class="text-[8.5px] text-slate-400 font-medium">Saved</span>
    </div>
  </div>

  <!-- Scrollable Action Center -->
  <div class="p-1.5 space-y-1.5 flex-1 overflow-y-auto no-scrollbar">
    
    <!-- 1. PROJECT STATE & AUTOSAVE -->
    <div class="bg-slate-50/80 p-1.5 rounded border border-slate-200 space-y-1">
      <div class="flex items-center justify-between">
        <button 
          id="btn-save-project" 
          onclick="saveProjectState(true)" 
          class="flex-1 mr-1.5 py-1 px-2 bg-blue-600 hover:bg-blue-700 text-white rounded text-[10px] font-bold shadow-2xs transition text-center cursor-pointer truncate"
        >
          <span id="save-btn-text">Save Calculation</span>
        </button>

        <!-- Autosave Toggle -->
        <label class="flex items-center gap-1 cursor-pointer select-none shrink-0" title="Toggle automatic background saving">
          <span class="text-[8.5px] font-semibold text-slate-500">Auto</span>
          <div class="relative inline-block w-5 h-3">
            <input type="checkbox" id="toggle-autosave" class="sr-only peer" checked onchange="handleAutosaveToggle(this.checked)">
            <div class="w-5 h-3 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-2 peer-checked:after:border-white after:content-[''] after:absolute after:top-[1px] after:left-[1px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-2.5 after:w-2.5 after:transition-all peer-checked:bg-emerald-600"></div>
          </div>
        </label>
      </div>
    </div>

    <!-- 2. OFFICIAL PDF DELIVERABLES (CONSOLIDATED 4 BOOKLETS) -->
    <div class="bg-slate-50/80 p-1.5 rounded border border-slate-200 space-y-1">
      <div class="text-[9px] font-bold text-slate-700 uppercase tracking-wider pb-0.5 border-b border-slate-200">
        PDF Booklets
      </div>

      <!-- Detail Calc PDF -->
      <button 
        id="btn-view-detail-calc-pdf" 
        onclick="openDetailCalcPdfModal()" 
        class="w-full py-1.5 px-2 bg-blue-600 hover:bg-blue-700 text-white rounded text-[10px] font-bold shadow-2xs transition flex items-center justify-center gap-1.5 cursor-pointer text-center"
        title="View Technical PDF Booklet: Cover Page + Dashboard + All Calculation Sheets with Vector Figures"
      >
        <svg class="w-3 h-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <span>Detail Calc PDF</span>
      </button>

      <!-- Lightship PDF -->
      <button 
        id="btn-view-lightship-pdf" 
        onclick="openLightshipPdfModal()" 
        class="w-full py-1.5 px-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded text-[10px] font-bold shadow-2xs transition flex items-center justify-center gap-1.5 cursor-pointer text-center"
        title="View Official Lightship PDF Booklet: Cover Page + Steel Plating + Stiffeners + 56% Outfitting"
      >
        <svg class="w-3 h-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <span>Lightship PDF</span>
      </button>

      <!-- Hull Strength PDF -->
      <button 
        id="btn-view-strength-pdf" 
        onclick="openStrengthPdfModal()" 
        class="w-full py-1.5 px-2 bg-indigo-700 hover:bg-indigo-800 text-white rounded text-[10px] font-bold shadow-2xs transition flex items-center justify-center gap-1.5 cursor-pointer text-center"
        title="View Official 4-Page Hull Strength & Midship Modulus PDF Booklet with Tables 66/67"
      >
        <svg class="w-3 h-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <span>Hull Strength PDF</span>
      </button>

      <!-- Application Form PDF -->
      <button 
        id="btn-view-app-form-pdf" 
        onclick="openAppFormPdfModal()" 
        class="w-full py-1.5 px-2 bg-amber-700 hover:bg-amber-800 text-white rounded text-[10px] font-bold shadow-2xs transition flex items-center justify-center gap-1.5 cursor-pointer text-center"
        title="View Official 25-Page DOS Application Form PDF with Corner Seals"
      >
        <svg class="w-3 h-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        <span>Application Form PDF</span>
      </button>
    </div>

    <!-- 3. COMPLIANCE & ENGINEERING UTILITIES -->
    <div class="bg-slate-50/80 p-1.5 rounded border border-slate-200 space-y-1">
      <div class="text-[9px] font-bold text-slate-700 uppercase tracking-wider pb-0.5 border-b border-slate-200">
        Utilities
      </div>

      <!-- Verify Deliverables -->
      <button 
        id="btn-verify-deliverables" 
        onclick="typeof openVerificationModal === 'function' ? openVerificationModal() : runFullVerificationSuite()" 
        class="w-full py-1.5 px-2 bg-purple-700 hover:bg-purple-800 text-white rounded text-[10px] font-bold shadow-2xs transition flex items-center justify-center gap-1.5 cursor-pointer text-center"
        title="Run 100-Point Statutory &amp; Scantling Cross-Verification Audit"
      >
        <span>Verify Deliverables</span>
        <span id="badge-verify-status" class="hidden"></span>
      </button>

      <!-- Auto-Comply Button -->
      <button 
        id="btn-auto-comply" 
        onclick="window.autoComplyModal && window.autoComplyModal.open ? window.autoComplyModal.open() : (window.calcBrainEngine && window.calcBrainEngine.autoComplyAllScantlings ? window.calcBrainEngine.autoComplyAllScantlings() : (typeof autoComplyAllScantlings === 'function' ? autoComplyAllScantlings() : alert('Auto-comply function is initializing...')))" 
        class="w-full py-1.5 px-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-[10px] font-bold shadow-2xs transition text-center cursor-pointer truncate"
        title="Auto-adjust actual scantlings to meet or exceed rule required minimums"
      >
        <span>Auto-Comply Scantlings</span>
      </button>

      <!-- .dos Project Files (2-Column Grid) -->
      <div class="grid grid-cols-2 gap-1 pt-0.5">
        <button 
          id="btn-save-dos" 
          class="py-1 px-1 bg-blue-600 hover:bg-blue-700 text-white rounded text-[9.5px] font-semibold transition text-center cursor-pointer truncate shadow-2xs" 
          title="Save complete project state in .dos format"
        >
          <span>Save (.dos)</span>
        </button>
        <button 
          id="btn-open-dos" 
          class="py-1 px-1 border border-slate-300 hover:bg-slate-100 text-slate-700 rounded text-[9.5px] font-semibold transition text-center cursor-pointer truncate" 
          title="Open or import a saved .dos project file"
        >
          <span>Open (.dos)</span>
        </button>
      </div>
      <input type="file" id="input-open-dos" accept=".dos,.json" class="hidden">

      <!-- Reset Defaults -->
      <button 
        id="btn-reset-default" 
        class="w-full py-0.5 border border-slate-200 hover:bg-slate-100 text-slate-500 rounded text-[8.5px] font-medium transition text-center cursor-pointer truncate" 
        title="Reset to Excel Master Defaults"
      >
        Reset Defaults
      </button>
    </div>

    <!-- 4. OFFICIAL ENGINEERING SEALS (COMPACT 2-COLUMN GRID) -->
    <div class="bg-slate-50/80 p-1.5 rounded border border-slate-200 space-y-1">
      <div class="text-[9px] font-bold text-slate-700 uppercase tracking-wider pb-0.5 border-b border-slate-200">
        Official Engineering Seals
      </div>

      <div class="grid grid-cols-2 gap-1.5">
        <!-- Designer Seal -->
        <div class="bg-white p-1 rounded border border-slate-200 flex flex-col justify-between">
          <div class="flex items-center justify-between mb-0.5">
            <span class="text-[9px] font-bold text-slate-800">Designer Seal</span>
            <button id="btn-clear-designer-seal" onclick="clearSeal('designer')" class="text-[7.5px] text-rose-600 hover:text-rose-800 hidden font-bold cursor-pointer">×</button>
          </div>
          <div id="preview-designer-seal" class="h-8 bg-slate-50/50 border border-slate-100 rounded flex items-center justify-center p-0.5 mb-1 overflow-hidden">
            <img id="img-designer-seal" src="/static/designer_seal_default.png" alt="Designer Seal" class="max-h-7 max-w-full object-contain"/>
          </div>
          <label for="upload-designer-seal" class="block cursor-pointer">
            <input type="file" id="upload-designer-seal" accept="image/png,image/jpeg,image/webp" class="sr-only" onclick="this.value=null;" onchange="handleSealUpload('designer', event)">
            <span class="w-full py-0.5 px-1 bg-blue-50 hover:bg-blue-100 border border-blue-200 text-blue-700 rounded text-[8.5px] font-bold block text-center transition cursor-pointer truncate">
              Upload Seal
            </span>
          </label>
        </div>

        <!-- Checker Seal -->
        <div class="bg-white p-1 rounded border border-slate-200 flex flex-col justify-between">
          <div class="flex items-center justify-between mb-0.5">
            <span class="text-[9px] font-bold text-slate-800">Checker Seal</span>
            <button id="btn-clear-checker-seal" onclick="clearSeal('checker')" class="text-[7.5px] text-rose-600 hover:text-rose-800 hidden font-bold cursor-pointer">×</button>
          </div>
          <div id="preview-checker-seal" class="h-8 bg-slate-50/50 border border-slate-100 rounded flex items-center justify-center p-0.5 mb-1 overflow-hidden">
            <img id="img-checker-seal" src="/static/checker_seal_default.png" alt="Checker Seal" class="max-h-7 max-w-full object-contain"/>
          </div>
          <label for="upload-checker-seal" class="block cursor-pointer">
            <input type="file" id="upload-checker-seal" accept="image/png,image/jpeg,image/webp" class="sr-only" onclick="this.value=null;" onchange="handleSealUpload('checker', event)">
            <span class="w-full py-0.5 px-1 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-700 rounded text-[8.5px] font-bold block text-center transition cursor-pointer truncate">
              Upload Seal
            </span>
          </label>
        </div>
      </div>
    </div>

    <!-- 5. VESSEL DATABASE (ARCHIVED SHIP CALCULATIONS) -->
    <div class="bg-slate-50/80 p-1.5 rounded border border-slate-200 space-y-1">
      <div class="text-[9px] font-bold text-slate-700 uppercase tracking-wider pb-0.5 border-b border-slate-200 flex items-center justify-between">
        <span>Vessel Database</span>
        <span id="nav-vessel-count" class="text-[8.5px] px-1.5 py-0.2 rounded font-mono font-bold bg-blue-100 text-blue-800">DB</span>
      </div>

      <button 
        id="btn-open-vessel-db"
        onclick="if (window.navigation) window.navigation.switchTab('vessel-db');" 
        class="w-full py-1.5 px-2 bg-slate-800 hover:bg-slate-900 text-white rounded text-[10px] font-bold shadow-2xs transition flex items-center justify-center gap-1.5 cursor-pointer text-center"
        title="Open Vessel Database Archive"
      >
        <svg class="w-3 h-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
        <span>Open Database</span>
      </button>

      <div class="grid grid-cols-2 gap-1 pt-0.5">
        <button 
          onclick="openSaveVesselModal()" 
          class="py-1 px-1 bg-blue-600 hover:bg-blue-700 text-white rounded text-[9px] font-semibold transition text-center cursor-pointer truncate shadow-2xs flex items-center justify-center gap-0.5" 
          title="Save this vessel into permanent Database"
        >
          <svg class="w-2.5 h-2.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
          <span>Save DB</span>
        </button>
        <button 
          onclick="if (window.navigation) window.navigation.switchTab('vessel-db');" 
          class="py-1 px-1 border border-slate-300 hover:bg-slate-100 text-slate-700 rounded text-[9px] font-semibold transition text-center cursor-pointer truncate flex items-center justify-center gap-0.5" 
          title="Browse stored vessels from database"
        >
          <span>Browse</span>
        </button>
      </div>
    </div>

  </div>

  <!-- Bottom Engine Indicator -->
  <div class="px-2 py-1 border-t border-slate-200 bg-slate-50/60 text-[8.5px] text-slate-400 flex items-center justify-between shrink-0 hidden md:flex">
    <span class="text-blue-700 font-bold truncate">PDF Vector Engine</span>
    <span class="font-mono text-slate-400">Active</span>
  </div>
</aside>
